name: Validate admin issue 1602
on:
  push:
    branches: [validation/1602-admin-a91f]
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: admin-1602-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Library and test compilation
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check -p admin 2>&1 | tee check-admin.log
          cargo check -p admin --tests 2>&1 | tee check-tests.log
      - name: Admin tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p admin -- --test-threads=2 2>&1 | tee test-admin.log
      - name: Release WASM and size budget
        id: wasm
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build -p admin --target wasm32v1-none --release 2>&1 | tee wasm-build.log
          bytes=$(stat -c%s target/wasm32v1-none/release/admin.wasm)
          echo "Unoptimized cargo artifact: $bytes bytes" | tee wasm-size.log
          curl --fail --location --retry 3 https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/stellar-1602.tar.gz"
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  $RUNNER_TEMP/stellar-1602.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/stellar-1602"
          tar -xzf "$RUNNER_TEMP/stellar-1602.tar.gz" -C "$RUNNER_TEMP/stellar-1602"
          stellar_bin=$(find "$RUNNER_TEMP/stellar-1602" -type f -name stellar -print -quit)
          test -n "$stellar_bin"
          "$stellar_bin" --version | tee stellar-version.log
          "$stellar_bin" contract build --package admin 2>&1 | tee stellar-build.log
          bytes=$(stat -c%s target/wasm32v1-none/release/admin.wasm)
          echo "Stellar build artifact: $bytes bytes; budget: 65536" | tee -a wasm-size.log
          test "$bytes" -le 65536
      - name: Workspace formatting
        continue-on-error: true
        run: cargo fmt --all -- --check > fmt-workspace.log 2>&1
      - name: Workspace Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings > clippy-workspace.log 2>&1
      - name: Workspace tests
        continue-on-error: true
        run: cargo test --workspace > test-workspace.log 2>&1
      - name: Error code wire stability
        continue-on-error: true
        run: cargo test -p credence_errors error_codes_wire > error-codes-wire.log 2>&1
      - name: Format only changed Rust regions
        run: |
          git fetch --depth 1 origin main
          python3 - <<'PY'
          import difflib, pathlib, subprocess, tempfile
          base = 'f3bd7c28ff84ff7b6d8131878a65fcc58b59ea5e'
          files = subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines()
          patches = []
          for name in files:
              if not name.startswith('contracts/admin/src/') or not name.endswith('.rs'):
                  continue
              path = pathlib.Path(name)
              current = path.read_text().splitlines(keepends=True)
              before = subprocess.check_output(['git','show',base+':'+name], text=True).splitlines(keepends=True)
              changed = [(c,d) for tag,a,b,c,d in difflib.SequenceMatcher(None,before,current,autojunk=False).get_opcodes() if tag!='equal']
              with tempfile.TemporaryDirectory() as directory:
                  formatted = pathlib.Path(directory)/path.name
                  formatted.write_text(''.join(current))
                  subprocess.run(['rustfmt','--edition','2021','--config','skip_children=true',str(formatted)],check=True)
                  lines = formatted.read_text().splitlines(keepends=True)
              selected = current[:]
              for tag,a,b,c,d in reversed(difflib.SequenceMatcher(None,current,lines,autojunk=False).get_opcodes()):
                  if tag!='equal' and any(a<=hi and b>=lo for lo,hi in changed):
                      selected[a:b] = lines[c:d]
              patches.extend(difflib.unified_diff(current,selected,fromfile='a/'+name,tofile='b/'+name))
          pathlib.Path('format-touched.patch').write_text(''.join(patches))
          pathlib.Path('format-touched-base.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-1602-validation
          path: |
            *.log
            format-touched.patch
            format-touched-base.txt
      - name: Enforce admin acceptance checks
        if: always()
        env:
          COMPILE: ${{ steps.compile.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WASM: ${{ steps.wasm.outcome }}
        run: test "$COMPILE/$TESTS/$WASM" = success/success/success
